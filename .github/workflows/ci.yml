name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version: 0.3.0
          node-version: 24
          working-directory: web
          cache: true
          run-install: false
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check, test and build frontend
        working-directory: web
        run: vp run quality
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-frontend
          path: internal/adapter/in/webui/dist
          if-no-files-found: error

  frontend-browser:
    needs: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version: 0.3.0
          node-version: 24
          working-directory: web
          cache: true
          run-install: false
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: internal/adapter/in/webui/dist
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Test console interactions
        working-directory: web
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  backend-quality:
    needs: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: internal/adapter/in/webui/dist
      - name: Verify Go module
        run: |
          go mod tidy -diff
          go mod verify
      - name: Check Go file sizes
        run: make file-size

      - name: Lint Go correctness
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m --disable=cyclop --disable=funlen --disable=gocognit --disable=maintidx --disable=nestif

      - name: Check changed-code maintainability
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m
          only-new-issues: true

      - name: Test Go with race detector and collect coverage
        run: |
          mkdir -p .artifacts
          go test -race -covermode=atomic -coverprofile=.artifacts/coverage.out ./...
          go tool cover -func=.artifacts/coverage.out

      - name: Build executable
        run: go build -trimpath -o bin/live ./cmd/live

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
