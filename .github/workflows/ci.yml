name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run the ten-minute media soak and fuzzing
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * 0'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: 0.3.0
          node-version: 24
          working-directory: web
          cache: true
          run-install: false
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check, test and build frontend
        working-directory: web
        run: vp run quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: embedded-frontend
          path: internal/server/webui/dist
          if-no-files-found: error

  frontend-browser:
    needs: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: 0.3.0
          node-version: 24
          working-directory: web
          cache: true
          run-install: false
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: embedded-frontend
          path: internal/server/webui/dist
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Test console interactions
        working-directory: web
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  backend-quality:
    needs: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: embedded-frontend
          path: internal/server/webui/dist
      - name: Check, test, build and scan backend
        run: make go-quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: .artifacts/coverage.*
          retention-days: 7

  backend-integration:
    needs: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: quality
          POSTGRES_DB: streaming_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quality -d streaming_quality"
          --health-interval=2s --health-timeout=3s --health-retries=15
    env:
      TEST_DATABASE_URL: postgres://quality:quality@127.0.0.1:5432/streaming_quality?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: embedded-frontend
          path: internal/server/webui/dist
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test PostgreSQL and media pipeline
        run: make go-integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-integration
          path: .artifacts/integration.json
          retention-days: 7

  backend-extended:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)
    needs: [backend-quality, backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: quality
          POSTGRES_DB: streaming_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quality -d streaming_quality"
          --health-interval=2s --health-timeout=3s --health-retries=15
    env:
      TEST_DATABASE_URL: postgres://quality:quality@127.0.0.1:5432/streaming_quality?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Exercise media continuity for ten minutes
        run: make go-soak
      - name: Fuzz timeline boundaries
        run: make go-fuzz FUZZ_TIME=2m
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-extended
          path: |
            .artifacts/soak.txt
            internal/live/testdata/fuzz/
          retention-days: 7
