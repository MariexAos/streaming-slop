name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify Go module
        run: |
          go mod tidy -diff
          go mod verify

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build embedded frontend
        working-directory: web
        run: npm run build

      - name: Check Go file sizes
        run: make file-size

      - name: Lint Go correctness
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m --disable=cyclop --disable=funlen --disable=gocognit --disable=maintidx --disable=nestif

      - name: Check changed-code maintainability
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m
          only-new-issues: true

      - name: Test Go with race detector and collect coverage
        run: |
          mkdir -p .artifacts
          go test -race -covermode=atomic -coverprofile=.artifacts/coverage.out ./...
          go tool cover -func=.artifacts/coverage.out

      - name: Build executable
        run: go build -trimpath -o bin/live ./cmd/live

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
