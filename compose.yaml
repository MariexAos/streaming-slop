services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: streaming_agent
      POSTGRES_USER: streaming_agent
      POSTGRES_PASSWORD: streaming_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming_agent -d streaming_agent"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8888:8888"
    restart: unless-stopped

volumes:
  postgres-data:
